<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd23f'/%3E%3Cstop offset='1' stop-color='%23ff2e88'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%232a0b45'/%3E%3Ccircle cx='16' cy='17' r='9' fill='url(%23s)'/%3E%3Cpath d='M6 19h20M6 22h20M6 25h20' stroke='%232a0b45' stroke-width='1.6'/%3E%3C/svg%3E">
  <style>
    /* The look: neon sunset over the city by the sea. A sunset sky up top, a palm skyline, neon pink and teal,
       bold slanted capitals. Light is the sunset, dark the night after it. */
    :root {
      color-scheme: light dark;
      --bg: #fff3ea;
      --surface: #ffffff;
      --text: #1f0f2e;
      --muted: #6e5677;
      --border: #f3d6dc;
      --accent: #c2126b;
      --accent-hover: #9e0c56;
      --accent-2: #0a7f86;
      --accent-soft: #ffe4f0;
      --danger: #b42318;
      --danger-soft: #fef3f2;
      --warn: #93370d;
      --warn-soft: #fff4e0;
      --chip: #fbe9ef;
      --glow: rgb(255 46 136 / 0.22);
      --shadow: 0 1px 2px rgb(42 11 69 / 0.06), 0 6px 20px rgb(194 18 107 / 0.08);
      --sky: linear-gradient(180deg, #2a0b45 0%, #6a1b6e 32%, #d7266f 62%, #ff7a3d 84%, #ffb347 100%);
      --sun: linear-gradient(180deg, #ffe66d 0%, #ffb347 45%, #ff4f8b 100%);
      --skyline: #2a0b45;
      --radius: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --display: Impact, Haettenschweiler, "Arial Narrow Bold", "Franklin Gothic Bold", ui-sans-serif, sans-serif;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12081f;
        --surface: #1d0f30;
        --text: #f6eafc;
        --muted: #b49cc4;
        --border: #3a2152;
        --accent: #ff5fae;
        --accent-hover: #ff8cc6;
        --accent-2: #3ff0e6;
        --accent-soft: #2d1240;
        --danger: #fda29b;
        --danger-soft: #2d1414;
        --warn: #fec84b;
        --warn-soft: #2a1d10;
        --chip: #2a1840;
        --glow: rgb(255 95 174 / 0.35);
        --shadow: 0 0 0 1px rgb(255 95 174 / 0.04), 0 8px 24px rgb(0 0 0 / 0.35);
        --sky: linear-gradient(180deg, #07021a 0%, #1f0846 38%, #5a1470 66%, #b0206e 88%, #e2465f 100%);
        --sun: linear-gradient(180deg, #ffd23f 0%, #ff7a3d 45%, #ff2e88 100%);
        --skyline: #07021a;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .wrap { width: 100%; max-width: 54rem; margin: 0 auto; padding: 0 1.25rem; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* The top: the sunset sky, the title and the search */
    header { position: relative; overflow: hidden; padding: 3.25rem 0 5.5rem; margin-bottom: 1.5rem; background: var(--sky); color: #fff; }
    header .wrap { position: relative; z-index: 1; }
    /* The sun: striped as it sinks behind the sea; the skyline: palms and towers in front of it */
    .sun {
      position: absolute; z-index: 0; right: max(4%, calc(50% - 30rem)); bottom: 2.2rem; width: 15rem; height: 15rem; border-radius: 50%;
      background: var(--sun); box-shadow: 0 0 60px 10px rgb(255 122 61 / 0.45);
      -webkit-mask: repeating-linear-gradient(180deg, #000 0 58%, transparent 58% 61%, #000 61% 70%, transparent 70% 74%, #000 74% 80%, transparent 80% 85%, #000 85% 89%, transparent 89% 100%);
      mask: repeating-linear-gradient(180deg, #000 0 58%, transparent 58% 61%, #000 61% 70%, transparent 70% 74%, #000 74% 80%, transparent 80% 85%, #000 85% 89%, transparent 89% 100%);
    }
    .skyline { position: absolute; z-index: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 6rem; color: var(--skyline); pointer-events: none; }
    .brand { display: flex; align-items: center; gap: .8rem; margin-bottom: .5rem; }
    .brand svg { flex: none; filter: drop-shadow(0 0 10px rgb(255 46 136 / 0.6)); }
    h1 {
      margin: 0; font-family: var(--display); font-weight: 900; font-style: italic; text-transform: uppercase;
      font-size: clamp(2.25rem, 6vw, 3.4rem); line-height: 1; letter-spacing: .02em; color: #fff;
      text-shadow: 0 0 6px rgb(255 255 255 / 0.5), 0 0 18px #ff2e88, 0 0 36px rgb(255 46 136 / 0.7), 3px 3px 0 #3ff0e6;
    }
    .tagline { max-width: 36rem; margin: 0 0 1.75rem; color: rgb(255 255 255 / 0.9); text-shadow: 0 1px 2px rgb(42 11 69 / 0.6); }
    .tagline code { color: #fff; background: rgb(255 255 255 / 0.16); }
    form { display: flex; gap: .6rem; }
    .field { position: relative; flex: 1; }
    .field svg { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    input {
      width: 100%; height: 3rem; padding: 0 1rem 0 2.75rem; font: inherit; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
      transition: border-color .15s, box-shadow .15s;
    }
    header input { border-color: transparent; box-shadow: 0 8px 28px rgb(42 11 69 / 0.35); }
    input::placeholder { color: var(--muted); }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
    input::-webkit-search-cancel-button { cursor: pointer; }
    button[type="submit"] {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 3rem; min-width: 7.5rem; padding: 0 1.5rem;
      font: inherit; font-family: var(--display); font-size: 1.15rem; font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: .06em;
      color: #fff; background: linear-gradient(135deg, #ff2e88 0%, #ff7a3d 100%); border: 2px solid rgb(255 255 255 / 0.85); border-radius: var(--radius);
      box-shadow: 0 0 0 0 transparent, 0 8px 24px rgb(255 46 136 / 0.45); text-shadow: 0 1px 2px rgb(42 11 69 / 0.45); cursor: pointer;
      transition: filter .15s, transform .05s, box-shadow .15s;
    }
    button[type="submit"]:hover { filter: brightness(1.08) saturate(1.1); box-shadow: 0 0 18px rgb(255 46 136 / 0.7), 0 8px 24px rgb(255 46 136 / 0.45); }
    button[type="submit"]:active { transform: translateY(1px); }
    button[type="submit"]:disabled { cursor: progress; opacity: .8; }
    .spinner { display: none; width: 1rem; height: 1rem; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
    button:disabled .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .examples { margin: .9rem 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; font-size: .875rem; color: #fff; text-shadow: 0 1px 2px rgb(42 11 69 / 0.6); }
    .examples span { font-family: var(--display); font-style: italic; text-transform: uppercase; letter-spacing: .06em; }
    .examples button {
      font: inherit; font-family: var(--mono); font-size: .8rem; color: #fff; background: rgb(42 11 69 / 0.45); text-shadow: none;
      border: 1px solid rgb(255 255 255 / 0.55); border-radius: 999px; padding: .2rem .75rem; cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .examples button:hover { border-color: #3ff0e6; background: rgb(42 11 69 / 0.7); box-shadow: 0 0 12px rgb(63 240 230 / 0.6); }
    /* Focus on the sky: a white ring with a night halo, seen against both the pink and the orange of the sunset */
    header :focus-visible { outline: 3px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 7px #2a0b45; }

    /* The bottom: the results */
    main.wrap { padding-bottom: 3rem; }
    .results-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; padding: 0 0 .9rem; }
    #status { margin: 0; font-weight: 600; font-size: 1.05rem; }
    #status.idle { font-weight: 400; color: var(--muted); }
    #status a { text-decoration: none; font-family: var(--display); font-style: italic; text-transform: uppercase; letter-spacing: .03em; font-size: 1.35rem; color: var(--accent); }
    #status a:hover { text-decoration: underline; }
    #status .count { color: var(--muted); font-weight: 500; }
    #status.error { font-weight: 500; color: var(--danger); background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); border-radius: var(--radius); padding: .75rem 1rem; width: 100%; }
    #commit { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
    #commit a { text-decoration: none; }
    #commit a:hover { color: var(--accent-2); }
    /* The filter: narrows the results shown, by a skill's name or description, or its repository */
    .tools { display: flex; gap: .6rem; align-items: flex-start; }
    .filter { position: relative; display: block; flex: 1; margin-bottom: .9rem; }
    .filter input { height: 2.5rem; font-size: .925rem; }
    /* The Cluster button: groups similar skills; pressed, it wears the sunset like the Scan button */
    #cluster {
      display: inline-flex; align-items: center; gap: .45rem; height: 2.5rem; padding: 0 1rem; flex: none;
      font: inherit; font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; font-size: .95rem;
      color: var(--accent); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer;
      transition: border-color .15s, box-shadow .15s, filter .15s;
    }
    #cluster:hover { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
    #cluster[aria-pressed="true"] { color: #fff; background: linear-gradient(135deg, #ff2e88 0%, #ff7a3d 100%); border-color: transparent; text-shadow: 0 1px 2px rgb(42 11 69 / 0.45); }
    #cluster:disabled { cursor: progress; opacity: .6; }
    /* The clusters: a map of the skills, then a section for each group of similar skills */
    #clusters { display: grid; gap: 1.5rem; }
    #cluster-note { margin: 0; font-size: .875rem; color: var(--muted); }
    #cluster-map { height: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    #cluster-map .problem { margin: 0; padding: 1rem; font-size: .875rem; color: var(--danger); }
    #cluster-groups { display: grid; gap: 1.5rem; }
    .cluster .repository-head h2 { display: flex; align-items: center; gap: .5rem; }
    .cluster .swatch { flex: none; width: .8rem; height: .8rem; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
    .skill .repository-name { font-weight: 600; color: var(--accent-2); }
    .skill.picked { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow), 0 8px 26px var(--glow); }
    #filter-note { margin: 0 0 .9rem; font-size: .875rem; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; }
    #skills { display: grid; gap: .65rem; }
    .skill {
      position: relative; padding: 1rem 1.15rem 1rem 1.4rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
      overflow: hidden; transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .skill::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg, #ff2e88, #ff7a3d 60%, #ffd23f); }
    .skill:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow: 0 0 0 1px var(--glow), 0 8px 26px var(--glow); transform: translateY(-1px); }
    .skill .name { font-weight: 750; font-size: 1.05rem; color: var(--accent); text-decoration: none; }
    .skill .name:hover { text-decoration: underline; }
    .skill .name::after { content: " ↗"; font-weight: 400; font-size: .85em; opacity: .6; color: var(--accent-2); }
    .summary { margin: .3rem 0 .55rem; }
    .meta { margin-top: .3rem; font-size: .8rem; color: var(--muted); }
    code { font-family: var(--mono); font-size: .78rem; background: var(--chip); border-radius: 6px; padding: .12rem .42rem; overflow-wrap: anywhere; }
    .empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
    .skeleton { height: 5.5rem; border-radius: var(--radius); background: linear-gradient(90deg, var(--chip) 25%, var(--accent-soft) 50%, var(--chip) 75%); background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    #loading { display: grid; gap: .65rem; }
    #repositories:not(:empty) + #loading { margin-top: 1.5rem; }
    /* An organization: one section per repository, in the order they are scanned */
    #repositories { display: grid; gap: 1.5rem; }
    #repositories:empty { display: none; }
    .repository-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .25rem 1rem; margin-bottom: .6rem; padding-bottom: .35rem; border-bottom: 2px solid; border-image: linear-gradient(90deg, #ff2e88, #ff7a3d, transparent) 1; }
    .repository-head h2 { margin: 0; font-size: 1.15rem; font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: .03em; }
    .repository-head h2 a { text-decoration: none; }
    .repository-head h2 a:hover { text-decoration: underline; }
    .repository-head .count { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-style: normal; font-weight: 500; font-size: .9rem; text-transform: none; letter-spacing: 0; }
    .repository-head .commit { font-family: var(--mono); font-size: .8rem; color: var(--muted); text-decoration: none; }
    .repository-head .commit:hover { color: var(--accent-2); }
    .repository .skills { display: grid; gap: .65rem; }
    .repository .problem { margin: 0; font-size: .875rem; color: var(--danger); }
    #warnings-box { margin-top: 1.25rem; color: var(--warn); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); border-radius: var(--radius); padding: .7rem 1rem; font-size: .875rem; }
    #warnings-box summary { cursor: pointer; font-weight: 600; }
    #warnings { margin-top: .5rem; display: grid; gap: .35rem; }
    #warnings li { overflow-wrap: anywhere; }
    @media (max-width: 34rem) {
      header { padding-top: 2rem; }
      .tools { flex-direction: column; align-items: stretch; gap: 0; }
      #cluster { justify-content: center; margin-bottom: .9rem; }
      .sun { width: 10rem; height: 10rem; right: -2rem; }
      form { flex-direction: column; }
      button[type="submit"] { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="sun" aria-hidden="true"></div>
    <svg class="skyline" viewBox="0 0 1440 96" preserveAspectRatio="none" aria-hidden="true" fill="currentColor"><path d="M0 96V78h60V58h18v-8h14v8h16v20h40V40h10v-6h20v6h10v38h30V64h26v14h44V52h22v26h34V30h8v-8h16v8h8v48h40V60h30v18h60V46h24v32h26V70h40v8h36V36h12v-10h18v10h12v42h32V62h28v16h50V50h20v28h46V24h10v-8h14v8h10v54h34V58h26v20h40V44h22v34h30V66h36v12h40V54h24v24h44V34h12v-6h16v6h12v44h36V60h28v18h50V48h22v30h60v18z" opacity=".55"/><path d="M0 96V88h1440v8z"/><path d="M118 90c2-18 4-34 3-50M121 40c-10-6-24-6-32 2 10-2 20-1 32-2zm0 0c-4-10-16-16-28-14 10 2 20 8 28 14zm0 0c4-11 16-17 28-16-10 3-20 8-28 16zm0 0c10-4 24-2 32 6-10-3-21-5-32-6zm0 0c-12 0-22 6-26 16 7-7 16-12 26-16zm0 0c11 2 20 9 23 18-6-8-14-14-23-18z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M1290 90c3-22 5-42 2-62M1292 28c-11-7-27-7-36 2 11-2 23-1 36-2zm0 0c-4-12-18-18-31-16 11 2 22 9 31 16zm0 0c5-12 18-19 31-18-11 3-22 9-31 18zm0 0c11-4 27-2 36 7-11-4-24-6-36-7zm0 0c-13 0-25 7-29 18 8-8 18-14 29-18zm0 0c12 2 22 10 26 20-7-9-16-16-26-20z" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M1350 90c1-14 2-26 1-38M1351 52c-8-5-19-5-25 1 8-1 16-1 25-1zm0 0c-3-8-13-12-22-11 8 1 15 6 22 11zm0 0c3-9 13-13 22-12-8 2-15 6-22 12zm0 0c8-3 19-1 25 5-8-3-17-4-25-5z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
    <div class="wrap">
      <div class="brand">
        <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="brand-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe66d"/><stop offset="1" stop-color="#ff2e88"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="#2a0b45" stroke="#ff2e88" stroke-width="1.5"/><circle cx="16" cy="17" r="9" fill="url(#brand-sun)"/><path d="M6 19h20M6 22h20M6 25h20" stroke="#2a0b45" stroke-width="1.6"/></svg>
        <h1>Skill Atlas</h1>
      </div>
      <p class="tagline">Every agent skill in a GitHub repository, or in each repository of an organization, with a link to its <code>SKILL.md</code>.</p>
      <form id="scan-form" role="search">
        <label class="field">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          <input id="repo" name="repo" type="search" placeholder="owner/repo, an organization, or a GitHub URL" aria-label="GitHub repository or organization" autocomplete="off" spellcheck="false" required autofocus>
        </label>
        <button id="scan" type="submit"><span class="spinner" aria-hidden="true"></span><span>Scan</span></button>
      </form>
      <p class="examples"><span>Try</span><button type="button" data-repo="JetBrains/kotlin">JetBrains/kotlin</button><button type="button" data-repo="JetBrains/MPS">JetBrains/MPS</button><button type="button" data-repo="JetBrains/koog">JetBrains/koog</button></p>
    </div>
  </header>
  <main id="results" class="wrap" aria-live="polite">
    <div class="results-head">
      <p id="status" class="idle">Enter a repository or an organization and press Scan.</p>
      <span id="commit"></span>
    </div>
    <div class="tools">
      <label class="field filter" id="filter-box" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M1 2.75A.75.75 0 011.75 2h12.5a.75.75 0 01.53 1.28L10 8.06v4.69a.75.75 0 01-.33.62l-2.5 1.67A.75.75 0 016 14.42V8.06L1.22 3.28A.75.75 0 011 2.75z"/></svg>
        <input id="filter" type="search" placeholder="Filter by name, description, or repository" aria-label="Filter skills by name, description, or repository" autocomplete="off" spellcheck="false">
      </label>
      <button id="cluster" type="button" aria-pressed="false" title="Group the skills that say similar things" hidden><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4.5" r="2.2"/><circle cx="7.5" cy="3" r="1.5"/><circle cx="5.5" cy="8" r="1.6"/><circle cx="11.5" cy="10.5" r="2.2"/><circle cx="12.5" cy="6.5" r="1.4"/><circle cx="8.5" cy="12.5" r="1.5"/></svg><span>Cluster</span></button>
    </div>
    <p id="filter-note" hidden></p>
    <ul id="skills"></ul>
    <div id="repositories"></div>
    <section id="clusters" aria-label="Similar skills, grouped" hidden>
      <p id="cluster-note"></p>
      <div id="cluster-map" role="img" aria-label="A map of the skills: similar skills close together, each group in its colour"></div>
      <div id="cluster-groups"></div>
    </section>
    <div id="loading" hidden><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    <details id="warnings-box" hidden>
      <summary id="warnings-title"></summary>
      <ul id="warnings"></ul>
    </details>
  </main>
  <script src="/cluster.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const form = $('scan-form');
    const input = $('repo');
    const button = $('scan');
    const status = $('status');
    const commit = $('commit');
    const loading = $('loading');
    const skillList = $('skills');
    const repositoryList = $('repositories');
    const warningBox = $('warnings-box');
    const warningTitle = $('warnings-title');
    const warningList = $('warnings');
    const filterBox = $('filter-box');
    const filterInput = $('filter');
    const filterNote = $('filter-note');
    const clusterButton = $('cluster');
    const clusterView = $('clusters');
    const clusterNote = $('cluster-note');
    const clusterMap = $('cluster-map');
    const clusterGroups = $('cluster-groups');
    let current = 0; // only the latest scan's answer is shown
    /** Every skill of the scan shown, `{ skill, repository }`, in the order shown: what the Cluster button groups. */
    let scanned = [];
    /** The clusters shown, or null: `{ result, cards, colors }`, a card and a colour for each skill and group. */
    let clustered = null;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function externalLink(href, className, text) {
      const link = element('a', className, text);
      link.href = href;
      link.target = '_blank';
      link.rel = 'noopener';
      return link;
    }

    function reset() {
      scanned = [];
      hideClusters();
      skillList.replaceChildren();
      repositoryList.replaceChildren();
      warningList.replaceChildren();
      warningBox.hidden = true;
      commit.replaceChildren();
      commit.removeAttribute('title');
      warningBox.open = false;
      filterInput.value = '';
      applyFilter();
    }

    /** The words of the filter, each must be in the skill's name, its description, or its repository's name. */
    const filterWords = () => filterInput.value.toLowerCase().split(/\s+/).filter(Boolean);
    const matches = (text, words) => words.every((word) => text.includes(word));

    /** Shows only the skills that match the filter; a repository section only with a match, a group the same. */
    function applyFilter() {
      const words = filterWords();
      // The list's cards: the clusters' are the same skills again.
      const skills = [...skillList.querySelectorAll('.skill'), ...repositoryList.querySelectorAll('.skill')];
      let shown = 0;
      for (const skill of skills) {
        skill.hidden = !matches(skill.dataset.search, words);
        if (!skill.hidden) shown++;
      }
      if (clustered) {
        for (const card of clustered.cards) card.hidden = !matches(card.dataset.search, words);
        for (const group of clusterGroups.querySelectorAll('.cluster')) group.hidden = !group.querySelector('.skill:not([hidden])');
        drawMap();
      }
      for (const section of repositoryList.querySelectorAll('.repository')) {
        // A repository that could not be scanned: shown while its name matches.
        section.hidden = section.dataset.error === undefined
          ? !section.querySelector('.skill:not([hidden])')
          : !matches(section.dataset.search, words);
      }
      filterBox.hidden = skills.length === 0;
      clusterButton.hidden = skills.length === 0;
      filterNote.hidden = words.length === 0 || skills.length === 0;
      filterNote.textContent = shown === 0
        ? `No skills match “${filterInput.value.trim()}”.`
        : `${shown} of ${plural(skills.length, 'skill', 'skills')} match`;
    }

    function showError(message) {
      status.className = 'error';
      status.replaceChildren(message);
    }

    /** `owner/repo · N skills`, the repository linked. */
    function showRepository(repository, count) {
      status.className = '';
      status.replaceChildren(
        externalLink(repository.url, '', repository.id),
        element('span', 'count', ` · ${count} ${count === 1 ? 'skill' : 'skills'}`),
      );
      if (repository.commit) {
        commit.replaceChildren(externalLink(`${repository.url}/tree/${repository.commit}`, '', `@ ${repository.commit.slice(0, 7)}`));
        commit.title = `Scanned commit ${repository.commit}`;
      }
    }

    /** A skill's card; `named`, its repository's name before its path, for the clusters, where repositories mix. */
    function skillItem(skill, repository, named = false) {
      if (!named) scanned.push({ skill, repository });
      const item = element('li', 'skill');
      item.dataset.search = [skill.name, skill.description, repository.id].join('\n').toLowerCase();
      item.append(externalLink(skill.link, 'name', skill.name));
      if (skill.summary) {
        const summary = element('p', 'summary', skill.summary);
        if (skill.description !== skill.summary) summary.title = skill.description;
        item.append(summary);
      }
      const path = element('div', 'meta');
      if (named) path.append(element('span', 'repository-name', repository.id), ' ');
      path.append(element('code', '', skill.path));
      item.append(path);
      if (skill.copies.length) {
        const copies = element('div', 'meta', 'also in ');
        skill.copies.forEach((copy, index) => {
          if (index) copies.append(', ');
          copies.append(element('code', '', copy));
        });
        item.append(copies);
      }
      return item;
    }

    const plural = (count, one, many) => `${count} ${count === 1 ? one : many}`;

    function showWarnings(warnings) {
      for (const warning of warnings) warningList.append(element('li', '', `warning: ${warning}`));
      const count = warningList.children.length;
      warningTitle.textContent = plural(count, 'warning', 'warnings');
      warningBox.hidden = count === 0;
    }

    /** One repository of an organization: its name, its skill count and commit, then its skills or why it was not scanned. */
    function repositorySection(line) {
      const section = element('section', 'repository');
      section.dataset.search = line.repository.id.toLowerCase();
      if (line.error) section.dataset.error = '';
      const head = element('div', 'repository-head');
      const title = element('h2');
      title.append(externalLink(line.repository.url, '', line.repository.id));
      if (line.skills) title.append(element('span', 'count', ` · ${plural(line.skills.length, 'skill', 'skills')}`));
      head.append(title);
      if (line.repository.commit) {
        const link = externalLink(`${line.repository.url}/tree/${line.repository.commit}`, 'commit', `@ ${line.repository.commit.slice(0, 7)}`);
        link.title = `Scanned commit ${line.repository.commit}`;
        head.append(link);
      }
      section.append(head);
      if (line.error) section.append(element('p', 'problem', line.error));
      else if (line.skills.length) {
        const list = element('ul', 'skills');
        for (const skill of line.skills) list.append(skillItem(skill, line.repository));
        section.append(list);
      }
      return section;
    }

    /** An organization's answer: a line for the organization, then one for each repository, as each is scanned. */
    async function readOrganization(response, id) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let total = 0;
      let scanned = 0;
      let skills = 0;
      const showProgress = (done) => {
        status.lastChild.textContent = ` · ${plural(total, 'repository', 'repositories')} · ${plural(skills, 'skill', 'skills')}`;
        commit.textContent = done ? '' : `${scanned} of ${total} scanned`;
      };
      const show = (line) => {
        if (line.organization) {
          total = line.repositories.length;
          status.className = '';
          status.replaceChildren(externalLink(line.organization.url, '', line.organization.id), element('span', 'count'));
          if (total === 0) repositoryList.append(element('p', 'empty', 'No repositories in this organization.'));
        } else if (line.repository) {
          scanned++;
          if (line.skills) skills += line.skills.length;
          // A repository with no skills is not shown: only its warnings.
          if (line.error || line.skills.length) {
            repositoryList.append(repositorySection(line));
            applyFilter();
          }
          if (line.warnings) showWarnings(line.warnings.map((warning) => `${line.repository.id}: ${warning}`));
          else showWarnings([`${line.repository.id}: ${line.error}; skipped`]);
        } else {
          // The scan had to stop: what is shown stays, the reason above it.
          showWarnings([line.error]);
          warningBox.open = true;
        }
        showProgress(false);
      };
      for (;;) {
        const { done, value } = await reader.read();
        if (id !== current) return reader.cancel();
        buffer += decoder.decode(value, { stream: !done });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) if (line.trim()) show(JSON.parse(line));
        if (done) break;
      }
      if (buffer.trim()) show(JSON.parse(buffer));
      if (total > 0 && scanned === total && repositoryList.children.length === 0) {
        repositoryList.append(element('p', 'empty', 'No skills in these repositories.'));
      }
      showProgress(true);
    }

    // The clusters: the skills shown, grouped by what they say (cluster.js), on a map drawn by Plotly.
    /** The colours of the groups, after the sunset; the skills in no group in grey. */
    const PALETTE = ['#ff2e88', '#0a9396', '#ff7a3d', '#7b2cbf', '#e0a100', '#2f6fdf', '#c2126b', '#2a9d4b', '#d35400', '#5e60ce'];
    const OTHER_COLOR = '#9a8aa5';

    let plotlyLoading = null;
    /** Plotly, from the server, the first time the map is drawn: the page does not need it until then. */
    function loadPlotly() {
      if (window.Plotly) return Promise.resolve(window.Plotly);
      plotlyLoading ??= new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = '/plotly.min.js';
        script.onload = () => (window.Plotly ? resolve(window.Plotly) : reject(new Error('Plotly did not load')));
        script.onerror = () => {
          plotlyLoading = null;
          script.remove();
          reject(new Error('Plotly could not be loaded'));
        };
        document.head.append(script);
      });
      return plotlyLoading;
    }

    /** Groups the skills scanned: the map above, then each group, its label and colour, then the skills in none. */
    function showClusters() {
      const result = SkillClusters.cluster(scanned.map(({ skill }) => skill));
      const cards = scanned.map(({ skill, repository }) => skillItem(skill, repository, true));
      const colors = scanned.map(() => OTHER_COLOR);
      const section = (title, color, members) => {
        const group = element('section', 'repository cluster');
        const head = element('div', 'repository-head');
        const heading = element('h2');
        const swatch = element('span', 'swatch');
        swatch.style.background = color;
        swatch.style.color = color;
        swatch.setAttribute('aria-hidden', 'true');
        heading.append(swatch, element('span', 'label', title), element('span', 'count', ` · ${plural(members.length, 'skill', 'skills')}`));
        head.append(heading);
        const list = element('ul', 'skills');
        for (const i of members) {
          colors[i] = color;
          list.append(cards[i]);
        }
        group.append(head, list);
        return group;
      };
      const groups = result.groups.map((group, index) => section(group.label.join(' · '), PALETTE[index % PALETTE.length], group.members));
      if (result.others.length) groups.push(section(result.groups.length ? 'Other skills' : 'No similar skills', OTHER_COLOR, result.others));
      clusterGroups.replaceChildren(...groups);
      clusterNote.textContent = `${plural(result.groups.length, 'group', 'groups')} of similar skills` +
        (result.others.length ? `, ${plural(result.others.length, 'skill', 'skills')} in none` : '') +
        ': by the words of their names and descriptions. Hover a point on the map to see its skill, click it to find it below.';
      clustered = { result, cards, colors };
      clusterButton.setAttribute('aria-pressed', 'true');
      clusterView.hidden = false;
      skillList.hidden = true;
      repositoryList.hidden = true;
      applyFilter();
    }

    /** Back to the list, each repository's skills. */
    function hideClusters() {
      clustered = null;
      clusterButton.setAttribute('aria-pressed', 'false');
      clusterView.hidden = true;
      skillList.hidden = false;
      repositoryList.hidden = false;
      if (window.Plotly) window.Plotly.purge(clusterMap);
      delete clusterMap.dataset.picking;
      clusterMap.replaceChildren();
      clusterGroups.replaceChildren();
    }

    /** The map: a point for each skill the filter shows, where its words put it, in its group's colour. One drawing
     * at a time, in order: typing in the filter asks for one a key. */
    let drawing = Promise.resolve();
    function drawMap() {
      const shown = clustered;
      drawing = drawing.then(() => drawMapOf(shown)).catch((error) => console.error(error));
      return drawing;
    }

    async function drawMapOf(shown) {
      if (shown !== clustered) return;
      let Plotly;
      try {
        Plotly = await loadPlotly();
      } catch (error) {
        if (shown === clustered) clusterMap.replaceChildren(element('p', 'problem', `The map could not be drawn: ${error.message}. The groups are below.`));
        return;
      }
      if (shown !== clustered) return; // pressed again, or another scan, while Plotly loaded
      const { result, cards, colors } = shown;
      const style = getComputedStyle(document.documentElement);
      const css = (name) => style.getPropertyValue(name).trim();
      const visible = (i) => !cards[i].hidden;
      const trace = (name, color, members) => {
        const indices = members.filter(visible);
        return {
          type: 'scatter',
          mode: indices.length <= 40 ? 'markers+text' : 'markers',
          name,
          x: indices.map((i) => result.points[i][0]),
          y: indices.map((i) => result.points[i][1]),
          text: indices.map((i) => scanned[i].skill.name),
          customdata: indices.map((i) => [i, scanned[i].repository.id, scanned[i].skill.summary || '']),
          hovertemplate: '<b>%{text}</b><br>%{customdata[1]}<br>%{customdata[2]}<extra>%{fullData.name}</extra>',
          textposition: 'top center',
          cliponaxis: false,
          textfont: { size: 11, color: css('--muted') },
          marker: { size: 12, color, opacity: 0.9, line: { width: 1.5, color: css('--surface') } },
        };
      };
      const data = result.groups.map((group, index) => trace(group.label.join(' · '), colors[group.members[0]], group.members));
      if (result.others.length) data.push(trace('Other skills', OTHER_COLOR, result.others));
      const axis = { showticklabels: false, zeroline: false, showgrid: true, gridcolor: css('--border'), showline: false, ticks: '', fixedrange: false };
      // Room around the points for their names: every skill's, not only the ones shown, so the map stays put.
      const range = (c, pad) => {
        const values = result.points.map((point) => point[c]);
        const low = Math.min(...values);
        const high = Math.max(...values);
        const room = (high - low || 1) * pad;
        return [low - room, high + room];
      };
      const layout = {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: { family: getComputedStyle(document.body).fontFamily, color: css('--text'), size: 12 },
        margin: { l: 16, r: 16, t: 16, b: 16 },
        xaxis: { ...axis, range: range(0, 0.18) },
        yaxis: { ...axis, range: range(1, 0.14) },
        hovermode: 'closest',
        hoverlabel: { font: { family: getComputedStyle(document.body).fontFamily } },
        legend: { orientation: 'v', x: 1, xanchor: 'right', y: 1, bgcolor: css('--surface'), bordercolor: css('--border'), borderwidth: 1 },
        showlegend: true,
      };
      clusterMap.querySelector(':scope > .problem')?.remove();
      await Plotly.react(clusterMap, data, layout, { displayModeBar: false, responsive: true });
      if (typeof clusterMap.on === 'function' && clusterMap.dataset.picking === undefined) {
        clusterMap.dataset.picking = '';
        clusterMap.on('plotly_click', (event) => pick(event.points[0].customdata[0]));
      }
    }

    /** A point clicked: its skill's card, scrolled to and lit up. */
    function pick(index) {
      if (!clustered) return;
      const card = clustered.cards[index];
      for (const other of clustered.cards) other.classList.remove('picked');
      card.classList.add('picked');
      card.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      card.querySelector('.name').focus({ preventScroll: true });
    }

    async function scan(repo) {
      const id = ++current;
      reset();
      button.disabled = true;
      clusterButton.disabled = true;
      loading.hidden = false;
      status.className = 'idle';
      status.replaceChildren(`Scanning ${repo}…`);
      history.replaceState(null, '', `?repo=${encodeURIComponent(repo)}`);
      try {
        const response = await fetch(`/api/scan?repo=${encodeURIComponent(repo)}`);
        if (response.ok && (response.headers.get('content-type') ?? '').startsWith('application/x-ndjson')) {
          return await readOrganization(response, id);
        }
        const answer = await response.json();
        if (id !== current) return;
        if (!response.ok) return showError(answer.error);
        showRepository(answer.repository, answer.skills.length);
        if (answer.skills.length === 0) skillList.append(element('li', 'empty', 'No skills in this repository.'));
        for (const skill of answer.skills) skillList.append(skillItem(skill, answer.repository));
        applyFilter();
        showWarnings(answer.warnings);
      } catch (error) {
        if (id === current) showError(`Cannot reach the server: ${error.message}`);
      } finally {
        if (id === current) {
          button.disabled = false;
          clusterButton.disabled = false;
          loading.hidden = true;
        }
      }
    }

    filterInput.addEventListener('input', applyFilter);
    clusterButton.addEventListener('click', () => (clustered ? hideClusters() : showClusters()));

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const repo = input.value.trim();
      if (repo && !button.disabled) scan(repo);
    });

    for (const example of document.querySelectorAll('.examples button')) {
      example.addEventListener('click', () => {
        if (button.disabled) return;
        input.value = example.dataset.repo;
        scan(example.dataset.repo);
      });
    }

    // A shared link, `/?repo=owner/repo`, scans at once.
    const shared = new URLSearchParams(location.search).get('repo');
    if (shared) {
      input.value = shared;
      scan(shared);
    }
  </script>
</body>
</html>
